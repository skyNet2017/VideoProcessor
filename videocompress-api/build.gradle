plugins {
    id 'com.android.library'
}

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.2"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.1.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    //implementation 'com.github.yellowcath:VideoProcessor:2.4.2'
    //api 'com.github.skyNet2017.VideoProcessor:videoprocessor:3.0.3'
    api project(':videoprocessor')

    //api 'com.github.hss01248.StartActivityResult:activityresult:1.1.9'
    api 'com.blankj:utilcodex:1.30.0'//基底
    //api 'com.github.hss01248.MyPermission:permission:2.4.6'
    api "io.reactivex.rxjava2:rxjava:2.2.6"
    implementation "com.github.bumptech.glide:glide:4.11.0"

}